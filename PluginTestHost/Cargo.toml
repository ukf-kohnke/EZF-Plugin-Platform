[package]
name = "PluginTestHost"
version = "3.5.4"
edition = "2024"
authors = ["EZF contributors"]
description = "Minimal standalone CLI for loading and exercising a single EZF domain plugin"
license = "MIT OR Apache-2.0"

[[bin]]
name = "ezf-plugin-test-host"
path = "src/main.rs"

[dependencies]
DatabaseContracts = { path = "../Plugin-SDK/DatabaseContracts" }
PluginAbi = { path = "../Plugin-SDK/PluginAbi" }
PluginContracts = { path = "../Plugin-SDK/PluginContracts" }
PluginHost = { path = "../PluginHost" }
serde = "1.0"
serde_json = "1.0"
