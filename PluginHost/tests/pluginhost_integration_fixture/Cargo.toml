[package]
name = "pluginhost-integration-fixture"
version = "3.5.2"
edition = "2024"
publish = false

# This fixture is deliberately standalone and is not a workspace member. It is built explicitly by
# PluginHost's dynamic-library integration tests and must never become part of product discovery.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
PluginContracts = { path = "../../../PluginContracts" }
DatabaseContracts = { path = "../../../DatabaseContracts" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
