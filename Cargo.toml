[workspace]
resolver = "2"

members = [
    "PluginHost",
    "PluginExecutionCore",
    "PluginIpc",
    "PluginWorker",
    "PluginTestHost",
    "FilterContracts"
]
exclude = ["Plugin-SDK"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.9.2"

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = '...'  # Platform-specific.
strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false

[profile.release]
opt-level = 3
debug = false
split-debuginfo = '...'  # Platform-specific.
strip = "none"
debug-assertions = false
overflow-checks = false
lto = false
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false
