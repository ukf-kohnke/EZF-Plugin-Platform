[workspace]

exclude = ["Plugin-SDK"]
members = [
    "PluginHost",
    "PluginExecutionCore",
    "PluginIpc",
    "PluginWorker",
    "PluginTestHost",
    "FilterContracts"
]

resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "1.0.3"

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = '...'  # Platform-specific.
strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false

[profile.release]
opt-level = 3
debug = false
split-debuginfo = '...'  # Platform-specific.
strip = "none"
debug-assertions = false
overflow-checks = false
lto = false
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false
