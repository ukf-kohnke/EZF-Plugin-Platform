[package]
name = "PluginTestHost"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Standalone ABI V2 integration test host for EZF domain plugins"
repository = "https://github.com/ukf-kohnke/EZF-Plugin-Platform.git"

[dependencies]
DatabaseContracts = { path = "../Plugin-SDK/DatabaseContracts" }
PluginAbi = { path = "../Plugin-SDK/PluginAbi" }
PluginContracts = { path = "../Plugin-SDK/PluginContracts" }
PluginHost = { path = "../PluginHost" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "ezf-plugin-test-host"
path = "src/main.rs"