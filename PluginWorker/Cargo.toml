[package]
name = "PluginWorker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Process-isolated EZF plugin worker with Linux enforced sandbox profiles"
publish = false

[[bin]]
name = "ezf-plugin-worker"
path = "src/main.rs"

[dependencies]
PluginIpc = { path = "../PluginIpc" }
PluginAbi = { path = "../Plugin-SDK/PluginAbi" }
PluginContracts = { path = "../Plugin-SDK/PluginContracts" }
DatabaseContracts = { path = "../Plugin-SDK/DatabaseContracts" }
PluginExecutionCore = { path = "../PluginExecutionCore" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[dev-dependencies]
PluginHost = { path = "../PluginHost" }
